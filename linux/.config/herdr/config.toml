onboarding = false
# Match the active tmux keymap in ~/.config/tmux/tmux.conf.
[keys]
prefix = "ctrl+space"

# Config and help
help = "prefix+?"
detach = "prefix+d"
reload_config = "prefix+q"

# Pane controls
split_vertical = ["prefix+\\", "prefix+v", "alt+shift+enter"]
split_horizontal = ["prefix+minus", "prefix+h", "alt+enter"]
close_pane = ["prefix+x", "alt+esc"]

focus_pane_left = ["ctrl+h", "ctrl+alt+left"]
focus_pane_right = ["ctrl+l", "ctrl+alt+right"]
focus_pane_up = ["ctrl+k", "ctrl+alt+up"]
focus_pane_down = ["ctrl+j", "ctrl+alt+down"]

# Prefix+r renames the current tmux window, represented by a Herdr tab.
resize_mode = ""
rename_pane = ""

# Tab controls (tmux windows)
rename_tab = "prefix+r"
new_tab = "prefix+c"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Workspace controls (tmux sessions)
rename_workspace = "prefix+shift+r"
new_workspace = "prefix+shift+c"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Herdr has no direct resize actions, so use its pane API for the tmux chords.
[[keys.command]]
key = "ctrl+alt+shift+left"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction left'
description = "Resize pane left"

[[keys.command]]
key = "ctrl+alt+shift+down"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction down'
description = "Resize pane down"

[[keys.command]]
key = "ctrl+alt+shift+up"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction up'
description = "Resize pane up"

[[keys.command]]
key = "ctrl+alt+shift+right"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction right'
description = "Resize pane right"

[theme]
name = "terminal"
auto_switch = false
