# Comfortable prefix: press Ctrl-Space, release, then press the command key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Convenient splits
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Hyprland-style directional pane focus
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind x kill-pane

# Reorder the current window without using the prefix
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# Practical quality-of-life settings
set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -s extended-keys on
set -s extended-keys-format csi-u
set -s terminal-features[100] "xterm-ghostty:extkeys"
set -g status-interval 3
set -g default-terminal "tmux-256color"

# Omarchy's minimal status bar uses terminal ANSI colours, so Ghostty's
# Catppuccin Latte/Frappe theme follows the macOS appearance automatically.
set -g status-position top
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -g status-style "bg=default,fg=default"
set -g status-left-style "default"
set -g status-right-style "default"
set -g window-status-style "default"
set -g window-status-current-style "default"
set -g status-left "#[fg=#11111b,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
setw -g pane-border-lines single
setw -g pane-border-indicators colour
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Navigate seamlessly between Neovim splits and tmux panes with Ctrl-h/j/k/l.
run ~/.config/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux

# Yank copy-mode selections to the macOS clipboard with y.
run ~/.config/tmux/plugins/tmux-plugins/tmux-yank/yank.tmux
